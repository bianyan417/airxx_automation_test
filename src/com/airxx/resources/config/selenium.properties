# Selenium WebDriver Configuration
# XXX Air Company Automation Framework

# Browser Configuration
browser=chrome
headless=false

# WebDriver Timeouts (seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30
script.timeout=30

# Window Configuration
window.width=1920
window.height=1080
maximize.window=true

# Screenshot Configuration
screenshot.format=png
screenshot.directory=./reports/screenshots

# Download Configuration
download.directory=./downloads
download.prompt=false

# Chrome Options
chrome.options=--disable-extensions,--disable-gpu,--no-sandbox,--disable-dev-shm-usage
chrome.experimental.options={"excludeSwitches":["enable-automation"]}

# Firefox Options
firefox.options=--width=1920,--height=1080
firefox.preferences={"browser.download.folderList":2}

# Edge Options
edge.options=--disable-extensions,--disable-gpu

# Remote WebDriver (for Selenium Grid / Cloud)
remote.driver.enabled=false
remote.driver.url=http://localhost:4444/wd/hub

# Selenium Grid
grid.enabled=false
grid.hub.url=http://localhost:4444

# BrowserStack Configuration
browserstack.enabled=false
browserstack.username=
browserstack.accesskey=
browserstack.os=Windows
browserstack.os.version=11
browserstack.browser.version=latest

# LambdaTest Configuration
lambdatest.enabled=false
lambdatest.username=
lambdatest.accesskey=

# Sauce Labs Configuration
saucelabs.enabled=false
saucelabs.username=
saucelabs.accesskey=

# Mobile Testing (Appium)
appium.enabled=false
appium.server.url=http://localhost:4723/wd/hub
appium.platform.name=Android
appium.platform.version=13.0
appium.device.name=emulator-5554
appium.app.path=

# Performance Settings
element.highlight.enabled=true
element.highlight.duration=100

# Proxy Settings
proxy.enabled=false
proxy.host=
proxy.port=
proxy.bypass=localhost
